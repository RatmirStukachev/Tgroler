{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h2>Admin Panel</h2>

    <div style="display: flex; gap: 10px; overflow-x: auto; margin-bottom: 20px; white-space: nowrap;">
        <button class="btn" onclick="showAdminTab('withdrawals')">Withdrawals</button>
        <button class="btn" onclick="showAdminTab('users')">Users</button>
        <button class="btn" onclick="showAdminTab('gifts')">Gifts</button>
        <button class="btn" onclick="showAdminTab('roulettes')">Roulettes</button>
        <button class="btn" onclick="showAdminTab('lotteries')">Lotteries</button>
        <button class="btn" onclick="showAdminTab('settings')">Settings</button>
    </div>

    <!-- WITHDRAWALS -->
    <div id="admin-withdrawals" class="admin-tab">
        <h3>Pending Withdrawals</h3>
        <div id="withdrawals-list"></div>
    </div>

    <!-- USERS -->
    <div id="admin-users" class="admin-tab" style="display: none;">
        <h3>Users</h3>
        <div id="users-list"></div>
    </div>

    <!-- GIFTS -->
    <div id="admin-gifts" class="admin-tab" style="display: none;">
        <h3>Gifts</h3>
        <div class="card" style="margin-bottom: 20px; text-align: left;">
            <h4>Create Gift</h4>
            <input type="text" id="gift-name" placeholder="Name">
            <input type="number" id="gift-dprice" placeholder="Display Price (Stars)">
            <input type="number" id="gift-sprice" placeholder="Sell Price (Stars)">
            <input type="file" id="gift-img">
            <button class="btn btn-accent" onclick="createGift()">Create</button>
        </div>
        <div id="gifts-list" class="grid"></div>
    </div>

    <!-- ROULETTES -->
    <div id="admin-roulettes" class="admin-tab" style="display: none;">
        <h3>Roulettes</h3>
        <div class="card" style="margin-bottom: 20px; text-align: left;">
            <h4>Create Roulette</h4>
            <input type="text" id="r-name" placeholder="Name">
            <input type="number" id="r-cost" placeholder="Spin Cost">
            <div id="r-gift-selector" style="max-height: 150px; overflow-y: auto; margin-bottom: 10px; border: 1px solid #444; padding: 5px;">
                <!-- Filled via JS -->
            </div>
            <button class="btn btn-accent" onclick="createRoulette()">Create</button>
        </div>
        <div id="roulettes-list"></div>
    </div>

    <!-- LOTTERIES -->
    <div id="admin-lotteries" class="admin-tab" style="display: none;">
        <h3>Lotteries</h3>
        <div class="card" style="margin-bottom: 20px; text-align: left;">
            <h4>Create Lottery</h4>
            <input type="text" id="l-name" placeholder="Name">
            <input type="number" id="l-total" placeholder="Total Tickets">
            <input type="number" id="l-cost" placeholder="Ticket Cost">
            <select id="l-prize"><!-- Filled via JS --></select>
            <input type="file" id="l-img">
            <button class="btn btn-accent" onclick="createLottery()">Create</button>
        </div>
        <div id="lotteries-list"></div>
    </div>

    <!-- SETTINGS -->
    <div id="admin-settings" class="admin-tab" style="display: none;">
        <h3>Settings</h3>
        <label>TON to Stars Rate</label>
        <input type="number" id="setting-rate" placeholder="e.g. 1 TON = 1000 Stars">
        <button class="btn btn-accent" onclick="saveSettings()">Save</button>
    </div>
</div>

<script>
    function showAdminTab(tab) {
        document.querySelectorAll('.admin-tab').forEach(el => el.style.display = 'none');
        document.getElementById('admin-' + tab).style.display = 'block';

        // Auto-load data based on tab
        if(tab === 'withdrawals') loadAdminWithdrawals();
        if(tab === 'users') loadAdminUsers();
        if(tab === 'gifts') loadAdminGifts();
        if(tab === 'roulettes') loadAdminRoulettes();
        if(tab === 'lotteries') loadAdminLotteries();
    }
</script>
{% endblock %}
