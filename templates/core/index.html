{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px; text-align: center;">

    <div id="roulette-tabs" style="display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 20px;">
        <!-- Filled via JS -->
    </div>

    <div id="roulette-display" class="card" style="display: none; padding: 30px; position: relative; overflow: hidden;">
        <h2 id="roulette-name"></h2>

        <div id="roulette-window" style="height: 100px; margin: 20px 0; overflow: hidden; position: relative; background: #2c2c34; border-radius: 10px; border: 2px solid var(--primary);">
            <div id="roulette-wheel" style="font-size: 60px; line-height: 100px; position: absolute; width: 100%; transition: transform 3s cubic-bezier(0.25, 1, 0.5, 1);">🎁</div>
        </div>

        <p>Cost: <span id="roulette-cost" style="color: gold; font-weight: bold;"></span> ⭐</p>
        <button id="spin-btn" class="btn" onclick="spinRoulette()" style="font-size: 1.2em; padding: 15px;">SPIN</button>
    </div>

    <div id="spin-result" style="margin-top: 20px; font-weight: bold; color: #007aff; font-size: 1.2em; min-height: 30px;"></div>
</div>

<style>
    .roulette-tab {
        background-color: var(--card-bg);
        border: 2px solid transparent;
        padding: 10px 20px;
        border-radius: 12px;
        white-space: nowrap;
        cursor: pointer;
        font-weight: bold;
    }
    .roulette-tab.active {
        border-color: var(--primary);
        background-color: #2a2a35;
    }
</style>
{% endblock %}

{% block scripts %}
<script>
    // These will be defined in app.js, loaded via APIs
</script>
{% endblock %}
