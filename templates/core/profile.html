{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h2>Profile</h2>
    <p>User: <span id="profile-name"></span></p>
    <p>ID: <span id="profile-id"></span></p>

    <div class="card" style="margin: 20px 0; text-align: left;">
        <h3>Top Up Balance (TON)</h3>
        <p style="color: #aaa; font-size: 12px;">Ensure your wallet is connected via the top bar.</p>
        <input type="number" id="deposit-amount" placeholder="Amount in TON (e.g., 0.5)" step="0.1">
        <button class="btn btn-accent" onclick="depositTON()">Deposit</button>
    </div>

    <h3>Inventory</h3>
    <div id="inventory-grid" class="grid">
        <!-- Inventory items injected via JS -->
    </div>

    <div style="margin-top: 30px;">
        <h3>Leaders (Top Stars)</h3>
        <div id="leaderboard-list">
            <!-- Filled via JS -->
        </div>
    </div>
</div>
{% endblock %}
