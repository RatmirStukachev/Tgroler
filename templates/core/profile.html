{% extends 'base.html' %}

{% block content %}
<div style="padding: 20px;">
    <h2>Профиль</h2>
    <p>Имя: <span id="profile-name"></span></p>
    <p>ID: <span id="profile-id"></span></p>

    <div class="card" style="margin: 20px 0; text-align: left;">
        <h3>Пополнение баланса</h3>
        <p style="color: #aaa; font-size: 12px;">Пополните баланс криптовалютой TON или Звёздами Telegram.</p>

        <div style="margin-bottom: 15px;">
            <h4>Через TON</h4>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="deposit-amount" placeholder="Количество TON (напр. 0.5)" step="0.1" style="margin: 0; flex: 1;">
                <button class="btn btn-accent" onclick="depositTON()" style="margin: 0; flex: 1;">Пополнить</button>
            </div>
        </div>

        <div>
            <h4>Через Telegram Stars</h4>
            <div style="display: flex; gap: 10px;">
                <input type="number" id="tg-stars-amount" placeholder="Количество Звёзд (напр. 50)" step="1" style="margin: 0; flex: 1;">
                <button class="btn" onclick="buyTelegramStars()" style="margin: 0; flex: 1; background-color: #2da5e1;">Купить</button>
            </div>
        </div>
    </div>

    <h3>Инвентарь</h3>
    <div id="inventory-grid" class="grid">
        <!-- Inventory items injected via JS -->
    </div>

    <div style="margin-top: 30px;">
        <h3>Лидеры (по балансу Звёзд)</h3>
        <div id="leaderboard-list">
            <!-- Filled via JS -->
        </div>
    </div>
</div>
{% endblock %}
